name: ironpath

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ironpath}
      POSTGRES_USER: ${POSTGRES_USER:-ironpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironpath_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: '3'

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - mailpit_data:/data
    ports:
      - ${MAILPIT_HTTP_PORT:-8025}:8025
    logging:
      options:
        max-size: 10m
        max-file: '3'

  backend:
    image: ironpath-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ironpath}
      DB_USERNAME: ${POSTGRES_USER:-ironpath}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ironpath_demo}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-noreply@ironpath.local}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - ${BACKEND_PORT:-8080}:8080
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres_data:
  mailpit_data:
