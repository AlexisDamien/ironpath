name: Docker CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Docker / Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare demo environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --wait --wait-timeout 240

      - name: Run end-to-end smoke checks
        run: bash scripts/docker-smoke-test.sh

      - name: Capture Docker status and logs
        if: always()
        run: |
          {
            echo '===== docker compose ps ====='
            docker compose ps || true
            echo
            echo '===== docker compose logs ====='
            docker compose logs --no-color || true
          } > docker-ci.log

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-ci-logs-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: docker-ci.log

      - name: Stop and remove the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
