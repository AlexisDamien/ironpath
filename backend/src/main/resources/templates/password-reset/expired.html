<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Lien expiré — IronPath</title>
    <link rel="stylesheet" href="/password-reset/password-reset.css">
</head>
<body>
<main class="card success-card" aria-labelledby="page-title">
    <div class="brand" aria-label="IronPath">
        <span class="brand-mark" aria-hidden="true">IP</span>
        <span>IRONPATH</span>
    </div>
    <div class="error-icon" aria-hidden="true">✕</div>
    <h1 id="page-title">Ce lien n'est plus valide</h1>
    <p>
        Le lien de réinitialisation de mot de passe est invalide, a déjà
        été utilisé, ou a expiré (les liens sont valables 30 minutes).
    </p>
    <p>
        Retournez dans l'application IronPath et refaites une demande de
        réinitialisation de mot de passe pour recevoir un nouveau lien.
    </p>
</main>
</body>
</html>
