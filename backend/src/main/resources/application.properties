spring.datasource.url=jdbc:postgresql://localhost:5432/ironpath
spring.datasource.username=ironpath_user
spring.datasource.password=ironpath_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.application.name=ironpath-backend
server.port=8080

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:5432/ironpath
spring.flyway.user=ironpath_user
spring.flyway.password=ironpath_pass