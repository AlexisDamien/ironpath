spring.datasource.url=jdbc:postgresql://localhost:5432/ironpath
spring.datasource.username=ironpath_user
spring.datasource.password=ironpath_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.application.name=ironpath-backend
server.port=8080

# Email - Mailtrap
spring.profiles.active=local

# JWT
jwt.secret=ironpath-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000