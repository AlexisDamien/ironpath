# Profil de démonstration Docker. Ne pas utiliser tel quel en production.

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/ironpath}
spring.datasource.username=${DB_USERNAME:ironpath}
spring.datasource.password=${DB_PASSWORD:ironpath_demo}
spring.datasource.driver-class-name=org.postgresql.Driver

# SMTP local capturé par Mailpit
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.default-encoding=UTF-8

# Sécurité de démonstration : valeurs fournies par .env
jwt.secret=${JWT_SECRET}
app.encryption.key=${APP_ENCRYPTION_KEY}

# URLs publiques utilisées dans les emails
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:noreply@ironpath.local}

# CORS local et documentation API
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
app.security.public-docs=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Proxy / tunnel local éventuel
server.forward-headers-strategy=framework

# Journalisation raisonnable pour la démonstration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
