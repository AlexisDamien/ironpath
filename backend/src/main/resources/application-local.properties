# Valeurs propres à la machine, non versionnées
spring.config.import=optional:file:./config/application-local-overrides.properties

# Base PostgreSQL locale
spring.datasource.url=jdbc:postgresql://localhost:5432/ironpath
spring.datasource.driver-class-name=org.postgresql.Driver

# SMTP Mailtrap local
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# Développement
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger disponible uniquement avec le profil local
app.security.public-docs=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# CORS pour un éventuel frontend Web local
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*